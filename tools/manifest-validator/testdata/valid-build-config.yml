build:
  language: dotnet
  solution: "TestProject.sln"
  target_frameworks:
    - "net6.0"
    - "net8.0"
  test_projects:
    - "**/*Tests.csproj"

signing:
  enabled: true
  certificate: "keyfactor-code-signing"
  sign_assemblies: true
  sign_packages: true

release:
  changelog_required: true
  auto_release: true
  nuget_publish: false

testing:
  unit_tests: true
  code_coverage: true
  coverage_threshold: 80