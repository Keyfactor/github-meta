name: Build and Release CA Gateway Template

on:
  push:
    branches: [ main, release-* ]
  pull_request:
    branches: [ main, release-* ]

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Validate Integration Manifest and Build Config
        uses: Keyfactor/github-meta/.github/actions/validate-manifest@main
        with:
          fail-on-missing: true
          require-build-config: true
          
  build:
    name: Build CA Gateway Template
    runs-on: windows-latest  # .NET Framework requires Windows
    needs: validate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Build .NET Framework Project
        uses: Keyfactor/github-meta/.github/actions/build-dotnet@main
        with:
          solution-file: "cagateway-template.sln"
          target-frameworks: '["netframework4.8"]'
          configuration: "Release"
          run-tests: false  # No test projects in template
          enable-signing: true
          
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ca-gateway-template-artifacts
          path: cagateway-template/bin/Release/
          retention-days: 30
          
  compliance-check:
    name: Check Build System Compliance
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Check Compliance
        uses: Keyfactor/github-meta/.github/actions/sync-checker@main
        with:
          enforce-compliance: false  # Don't fail on issues, just report
          generate-fixes: true
          
      - name: Upload Compliance Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compliance-report
          path: compliance-fixes.md
          retention-days: 7
          
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ca-gateway-template-artifacts
          path: artifacts/
          
      - name: Create Release
        uses: Keyfactor/github-meta/.github/actions/release-manager@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          branch-name: ${{ github.ref_name }}
          artifacts-path: "artifacts"
          changelog-required: true
          create-tag: true
          create-release: true
          enable-signing: true
          
  preview-build:
    name: Preview Build (Demo)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Run Preview Build
        uses: Keyfactor/github-meta/.github/actions/preview-builder@main
        with:
          has-build-config: "true"
          configured-language: "dotnet"