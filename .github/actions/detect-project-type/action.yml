name: 'Detect Project Type'
description: 'Validates that language is explicitly specified in .keyfactor-build.yml - no automatic detection'
author: 'Keyfactor'

inputs:
  working-directory:
    description: 'Working directory to analyze'
    required: false
    default: '.'

outputs:
  language:
    description: 'Configured language from .keyfactor-build.yml (empty if not configured)'
    value: ${{ steps.validate.outputs.language }}
    
  has-build-config:
    description: 'Whether .keyfactor-build.yml exists'
    value: ${{ steps.validate.outputs.has-build-config }}
    
  validation-message:
    description: 'Message about configuration status'
    value: ${{ steps.validate.outputs.validation-message }}

runs:
  using: 'composite'
  steps:
    - name: Validate explicit configuration
      id: validate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "Checking for explicit build configuration..."
        
        LANGUAGE=""
        HAS_BUILD_CONFIG="false"
        VALIDATION_MESSAGE=""
        
        if [ -f ".keyfactor-build.yml" ]; then
          echo "✓ Found .keyfactor-build.yml"
          HAS_BUILD_CONFIG="true"
          
          # Extract language from build config (requires yq or manual parsing)
          if command -v yq >/dev/null 2>&1; then
            LANGUAGE=$(yq eval '.build.language // ""' .keyfactor-build.yml)
            
            if [ "$LANGUAGE" != "" ] && [ "$LANGUAGE" != "null" ]; then
              echo "✓ Language explicitly configured: $LANGUAGE"
              VALIDATION_MESSAGE="Language configured: $LANGUAGE"
            else
              echo "❌ Language not specified in .keyfactor-build.yml"
              VALIDATION_MESSAGE="ERROR: build.language must be specified in .keyfactor-build.yml"
            fi
          else
            # Fallback: simple grep-based detection
            if grep -q "language:" .keyfactor-build.yml; then
              LANGUAGE=$(grep "language:" .keyfactor-build.yml | head -1 | sed 's/.*language: *"\?\([^"]*\)"\?.*/\1/' | xargs)
              echo "✓ Language detected via grep: $LANGUAGE"
              VALIDATION_MESSAGE="Language configured: $LANGUAGE"
            else
              echo "❌ No language specified in .keyfactor-build.yml"
              VALIDATION_MESSAGE="ERROR: build.language must be specified in .keyfactor-build.yml"
            fi
          fi
        else
          echo "? No .keyfactor-build.yml found"
          HAS_BUILD_CONFIG="false"
          VALIDATION_MESSAGE="No build configuration found - repository will run in preview mode only"
        fi
        
        # Validate language value if present
        if [ "$LANGUAGE" != "" ]; then
          case "$LANGUAGE" in
            "dotnet"|"golang"|"kubernetes"|"generic")
              echo "✓ Valid language: $LANGUAGE"
              ;;
            *)
              echo "❌ Invalid language: $LANGUAGE"
              VALIDATION_MESSAGE="ERROR: Invalid language '$LANGUAGE'. Must be: dotnet, golang, kubernetes, or generic"
              LANGUAGE=""
              ;;
          esac
        fi
        
        # Set outputs
        echo "language=$LANGUAGE" >> $GITHUB_OUTPUT
        echo "has-build-config=$HAS_BUILD_CONFIG" >> $GITHUB_OUTPUT
        echo "validation-message=$VALIDATION_MESSAGE" >> $GITHUB_OUTPUT
        
        # Generate summary
        echo "## Build Configuration Validation" >> $GITHUB_STEP_SUMMARY
        
        if [ "$HAS_BUILD_CONFIG" = "true" ]; then
          echo "- **Configuration File**: ✅ .keyfactor-build.yml found" >> $GITHUB_STEP_SUMMARY
          
          if [ "$LANGUAGE" != "" ]; then
            echo "- **Language**: ✅ $LANGUAGE (explicitly configured)" >> $GITHUB_STEP_SUMMARY
            echo "- **Build Mode**: 🚀 Full build system enabled" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Language**: ❌ Not specified or invalid" >> $GITHUB_STEP_SUMMARY
            echo "- **Build Mode**: 🚧 Configuration error" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Required**: Add \`language\` field to \`.keyfactor-build.yml\`:" >> $GITHUB_STEP_SUMMARY
            echo '```yaml' >> $GITHUB_STEP_SUMMARY
            echo 'build:' >> $GITHUB_STEP_SUMMARY
            echo '  language: dotnet  # or golang, kubernetes, generic' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "- **Configuration File**: ⚠️  .keyfactor-build.yml not found" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Mode**: 🔍 Preview mode only (no releases)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**To enable full build system**: Create \`.keyfactor-build.yml\` with:" >> $GITHUB_STEP_SUMMARY
          echo '```yaml' >> $GITHUB_STEP_SUMMARY
          echo 'build:' >> $GITHUB_STEP_SUMMARY
          echo '  language: dotnet  # Choose: dotnet, golang, kubernetes, or generic' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi