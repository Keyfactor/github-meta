name: 'Build Go Project'
description: 'Multi-version Go builds with module support and code signing'
author: 'Keyfactor'

inputs:
  go-version:
    description: 'Go version to use for build'
    required: false
    default: '1.21'
    
  go-version-matrix:
    description: 'JSON array of Go versions to build against'
    required: false
    default: '["1.20", "1.21"]'
    
  module-path:
    description: 'Path to go.mod file (relative to working directory)'
    required: false
    default: '.'
    
  build-flags:
    description: 'Additional flags to pass to go build'
    required: false
    default: '-v'
    
  run-tests:
    description: 'Whether to run unit tests'
    required: false
    default: 'true'
    
  test-flags:
    description: 'Additional flags to pass to go test'
    required: false
    default: '-v -race -coverprofile=coverage.out'
    
  enable-signing:
    description: 'Whether to enable code signing'
    required: false
    default: 'false'
    
  signing-certificate:
    description: 'Name of the code signing certificate'
    required: false
    default: 'keyfactor-code-signing'
    
  build-targets:
    description: 'JSON array of build targets (GOOS/GOARCH combinations)'
    required: false
    default: '["linux/amd64", "windows/amd64", "darwin/amd64"]'
    
  output-directory:
    description: 'Directory for build artifacts'
    required: false
    default: 'dist'
    
  working-directory:
    description: 'Working directory for build operations'
    required: false
    default: '.'

outputs:
  build-success:
    description: 'Whether the build succeeded'
    value: ${{ steps.build.outputs.build-success }}
    
  test-results:
    description: 'Test execution results'
    value: ${{ steps.test.outputs.test-results }}
    
  coverage-percentage:
    description: 'Code coverage percentage achieved'
    value: ${{ steps.test.outputs.coverage-percentage }}
    
  artifacts-path:
    description: 'Path to build artifacts'
    value: ${{ steps.build.outputs.artifacts-path }}

runs:
  using: 'composite'
  steps:
    - name: Setup Go
      uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
      with:
        go-version: ${{ inputs.go-version }}
        
    - name: Verify Go installation
      shell: bash
      run: |
        go version
        go env
        
    - name: Download dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        MODULE_PATH: ${{ inputs.module-path }}
      run: |
        echo "Downloading Go dependencies..."
        
        if [ "$MODULE_PATH" != "." ]; then
          cd "$MODULE_PATH"
        fi
        
        if [ ! -f "go.mod" ]; then
          echo "❌ go.mod not found in $MODULE_PATH"
          exit 1
        fi
        
        go mod download
        go mod verify
        echo "✅ Dependencies downloaded and verified"
        
    - name: Run tests
      id: test
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      if: inputs.run-tests == 'true'
      env:
        MODULE_PATH: ${{ inputs.module-path }}
        TEST_FLAGS: ${{ inputs.test-flags }}
      run: |
        echo "Running Go tests..."
        
        if [ "$MODULE_PATH" != "." ]; then
          cd "$MODULE_PATH"
        fi
        
        TEST_SUCCESS="true"
        COVERAGE_PERCENTAGE="0"
        
        # Run tests with coverage
        if go test $TEST_FLAGS ./...; then
          echo "✅ Tests passed"
          
          # Extract coverage percentage if coverage file exists
          if [ -f "coverage.out" ]; then
            if command -v go >/dev/null 2>&1; then
              COVERAGE_RAW=$(go tool cover -func=coverage.out | grep "total:" | awk '{print $3}' | sed 's/%//')
              COVERAGE_PERCENTAGE=${COVERAGE_RAW:-0}
              echo "📊 Coverage: $COVERAGE_PERCENTAGE%"
            fi
          fi
        else
          echo "❌ Tests failed"
          TEST_SUCCESS="false"
        fi
        
        echo "test-results=$TEST_SUCCESS" >> $GITHUB_OUTPUT
        echo "coverage-percentage=$COVERAGE_PERCENTAGE" >> $GITHUB_OUTPUT
        
    - name: Build binaries
      id: build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GO_VERSION_MATRIX: ${{ inputs.go-version-matrix }}
        MODULE_PATH: ${{ inputs.module-path }}
        BUILD_FLAGS: ${{ inputs.build-flags }}
        BUILD_TARGETS: ${{ inputs.build-targets }}
        OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
      run: |
        echo "Building Go binaries..."
        
        if [ "$MODULE_PATH" != "." ]; then
          cd "$MODULE_PATH"
        fi
        
        BUILD_SUCCESS="true"
        
        # Create output directory
        mkdir -p "$OUTPUT_DIRECTORY"
        
        # Parse build targets JSON array
        TARGETS_LIST=$(echo "$BUILD_TARGETS" | sed 's/\[//g' | sed 's/\]//g' | sed 's/"//g' | tr ',' '\n')
        
        # Get binary name from module
        BINARY_NAME=$(go list -m)
        if [ -z "$BINARY_NAME" ]; then
          BINARY_NAME="app"
        else
          BINARY_NAME=$(basename "$BINARY_NAME")
        fi
        
        echo "Building binary: $BINARY_NAME"
        echo "Build targets: $BUILD_TARGETS"
        
        for target in $TARGETS_LIST; do
          target=$(echo "$target" | xargs)  # trim whitespace
          if [ -z "$target" ]; then
            continue
          fi
          
          # Parse GOOS/GOARCH
          GOOS=$(echo "$target" | cut -d'/' -f1)
          GOARCH=$(echo "$target" | cut -d'/' -f2)
          
          echo "Building for $GOOS/$GOARCH..."
          
          # Set output filename with proper extension
          OUTPUT_NAME="$BINARY_NAME-$GOOS-$GOARCH"
          if [ "$GOOS" = "windows" ]; then
            OUTPUT_NAME="$OUTPUT_NAME.exe"
          fi
          
          # Build binary
          if env GOOS="$GOOS" GOARCH="$GOARCH" go build $BUILD_FLAGS -o "$OUTPUT_DIRECTORY/$OUTPUT_NAME"; then
            echo "✅ Built $OUTPUT_NAME"
            
            # Verify binary was created
            if [ -f "$OUTPUT_DIRECTORY/$OUTPUT_NAME" ]; then
              ls -la "$OUTPUT_DIRECTORY/$OUTPUT_NAME"
            else
              echo "❌ Binary not found: $OUTPUT_DIRECTORY/$OUTPUT_NAME"
              BUILD_SUCCESS="false"
            fi
          else
            echo "❌ Build failed for $GOOS/$GOARCH"
            BUILD_SUCCESS="false"
          fi
        done
        
        echo "build-success=$BUILD_SUCCESS" >> $GITHUB_OUTPUT
        echo "artifacts-path=$OUTPUT_DIRECTORY" >> $GITHUB_OUTPUT
        
        if [ "$BUILD_SUCCESS" != "true" ]; then
          echo "❌ One or more builds failed"
          exit 1
        fi
        
    - name: Sign binaries
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      if: inputs.enable-signing == 'true'
      env:
        SIGNING_CERTIFICATE: ${{ inputs.signing-certificate }}
        ARTIFACTS_PATH: ${{ steps.build.outputs.artifacts-path }}
      run: |
        echo "Code signing is enabled but not implemented yet"
        echo "TODO: Implement binary signing with certificate $SIGNING_CERTIFICATE"
        echo "Artifacts to sign in: $ARTIFACTS_PATH"
        
    - name: Generate build summary
      shell: bash
      env:
        BUILD_SUCCESS: ${{ steps.build.outputs.build-success }}
        MODULE_PATH: ${{ inputs.module-path }}
        GO_VERSION: ${{ inputs.go-version }}
        BUILD_TARGETS: ${{ inputs.build-targets }}
        RUN_TESTS: ${{ inputs.run-tests }}
        TEST_RESULTS: ${{ steps.test.outputs.test-results }}
        COVERAGE_PERCENTAGE: ${{ steps.test.outputs.coverage-percentage }}
        ENABLE_SIGNING: ${{ inputs.enable-signing }}
      run: |
        echo "## Go Build Results" >> $GITHUB_STEP_SUMMARY
        if [ "$BUILD_SUCCESS" = "true" ]; then
          echo "- **Build Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
        else
          echo "- **Build Status**: ❌ Failed" >> $GITHUB_STEP_SUMMARY
        fi
        echo "- **Go Version**: $GO_VERSION" >> $GITHUB_STEP_SUMMARY
        echo "- **Module Path**: \`$MODULE_PATH\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Targets**: \`$BUILD_TARGETS\`" >> $GITHUB_STEP_SUMMARY
        
        if [ "$RUN_TESTS" = "true" ]; then
          if [ "$TEST_RESULTS" = "true" ]; then
            echo "- **Tests**: ✅ Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Tests**: ❌ Failed" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "$COVERAGE_PERCENTAGE" ] && [ "$COVERAGE_PERCENTAGE" != "0" ]; then
            echo "- **Coverage**: $COVERAGE_PERCENTAGE%" >> $GITHUB_STEP_SUMMARY
          fi
        fi
        
        if [ "$ENABLE_SIGNING" = "true" ]; then
          echo "- **Code Signing**: 🔐 Enabled" >> $GITHUB_STEP_SUMMARY
        fi