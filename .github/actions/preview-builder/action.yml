name: 'Preview Builder'
description: 'Provides validation-only builds for repositories without .keyfactor-build.yml or missing language configuration'
author: 'Keyfactor'

inputs:
  has-build-config:
    description: 'Whether .keyfactor-build.yml exists (from detect-project-type)'
    required: true
    
  configured-language:
    description: 'Configured language from .keyfactor-build.yml (empty if not configured)'
    required: false
    default: ''
    
  working-directory:
    description: 'Working directory for build operations'
    required: false
    default: '.'

outputs:
  preview-status:
    description: 'Preview build status (validation-only, no-config, config-error)'
    value: ${{ steps.preview.outputs.preview-status }}

runs:
  using: 'composite'
  steps:
    - name: Execute preview validation
      id: preview
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        HAS_BUILD_CONFIG: ${{ inputs.has-build-config }}
        CONFIGURED_LANGUAGE: ${{ inputs.configured-language }}
      run: |
        echo "🔍 PREVIEW MODE: Validation-only build (no releases will be created)"
        
        PREVIEW_STATUS="validation-only"
        
        if [ "$HAS_BUILD_CONFIG" = "false" ]; then
          echo "📋 No .keyfactor-build.yml found - this repository is in preview mode"
          echo "   ✓ Repository structure will be validated"
          echo "   ✓ Integration manifest will be checked"  
          echo "   ❌ No builds will be executed"
          echo "   ❌ No releases will be created"
          
          PREVIEW_STATUS="no-config"
          
        elif [ -z "$CONFIGURED_LANGUAGE" ]; then
          echo "⚠️  .keyfactor-build.yml exists but language is not configured"
          echo "   ❌ Cannot execute builds without explicit language specification"
          echo "   ❌ No releases will be created"
          
          PREVIEW_STATUS="config-error"
          
        else
          echo "ℹ️  Repository has configuration but is running in preview mode"
          echo "   Language: $CONFIGURED_LANGUAGE"
          echo "   ✓ Basic validation will be performed"
          echo "   ❌ Full builds disabled in preview mode"
          echo "   ❌ No releases will be created"
        fi
        
        # Basic file structure validation
        echo ""
        echo "📁 Repository Structure Validation:"
        
        # Check for integration manifest
        if [ -f "integration-manifest.json" ]; then
          echo "   ✅ integration-manifest.json found"
        else
          echo "   ❌ integration-manifest.json missing (required)"
        fi
        
        # Check for build config
        if [ -f ".keyfactor-build.yml" ]; then
          echo "   ✅ .keyfactor-build.yml found"
        else
          echo "   ⚠️  .keyfactor-build.yml missing (required for full build system)"
        fi
        
        # Check for changelog
        if [ -f "changelog.yml" ]; then
          echo "   ✅ changelog.yml found"
        else
          echo "   ⚠️  changelog.yml missing (required for releases)"
        fi
        
        # Language-specific file checks (only if language is configured)
        if [ -n "$CONFIGURED_LANGUAGE" ]; then
          echo ""
          echo "🔧 Language-specific validation ($CONFIGURED_LANGUAGE):"
          
          case "$CONFIGURED_LANGUAGE" in
            "dotnet")
              if find . -maxdepth 2 -name "*.sln" | head -1 | grep -q .; then
                echo "   ✅ .NET solution files found"
              elif find . -maxdepth 3 -name "*.csproj" | head -1 | grep -q .; then
                echo "   ✅ .NET project files found"
              else
                echo "   ⚠️  No .NET solution or project files found"
              fi
              ;;
              
            "golang")
              if [ -f "go.mod" ]; then
                echo "   ✅ Go module file found"
              else
                echo "   ⚠️  go.mod not found"
              fi
              ;;
              
            "kubernetes")
              if [ -f "Dockerfile" ] || [ -f "docker/Dockerfile" ]; then
                echo "   ✅ Dockerfile found"
              else
                echo "   ⚠️  Dockerfile not found"
              fi
              ;;
              
            "generic")
              echo "   ✅ Generic project (no specific file requirements)"
              ;;
          esac
        fi
        
        echo "preview-status=$PREVIEW_STATUS" >> $GITHUB_OUTPUT
        
    - name: Generate preview summary
      shell: bash
      env:
        PREVIEW_STATUS: ${{ steps.preview.outputs.preview-status }}
        CONFIGURED_LANGUAGE: ${{ inputs.configured-language }}
      run: |
        echo "## 🔍 Preview Mode Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "⚠️  **This repository is running in PREVIEW MODE** - no releases will be created." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        case "$PREVIEW_STATUS" in
          "no-config")
            echo "### Missing Build Configuration" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "This repository does not have a \`.keyfactor-build.yml\` file." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**To enable full build system with releases:**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '1. Create `.keyfactor-build.yml` in repository root:' >> $GITHUB_STEP_SUMMARY
            echo '```yaml' >> $GITHUB_STEP_SUMMARY
            echo 'build:' >> $GITHUB_STEP_SUMMARY
            echo '  language: dotnet  # Choose: dotnet, golang, kubernetes, or generic' >> $GITHUB_STEP_SUMMARY
            echo '  # Add language-specific configuration' >> $GITHUB_STEP_SUMMARY
            echo '' >> $GITHUB_STEP_SUMMARY
            echo 'signing:' >> $GITHUB_STEP_SUMMARY
            echo '  enabled: true' >> $GITHUB_STEP_SUMMARY
            echo '' >> $GITHUB_STEP_SUMMARY
            echo 'release:' >> $GITHUB_STEP_SUMMARY
            echo '  auto_release: true' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '2. Create `changelog.yml` for release management' >> $GITHUB_STEP_SUMMARY
            ;;
            
          "config-error")
            echo "### Configuration Error" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The \`.keyfactor-build.yml\` file exists but is missing required configuration." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Required Fix:**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo 'Add the `language` field to your `.keyfactor-build.yml`:' >> $GITHUB_STEP_SUMMARY
            echo '```yaml' >> $GITHUB_STEP_SUMMARY
            echo 'build:' >> $GITHUB_STEP_SUMMARY
            echo '  language: dotnet  # Must be: dotnet, golang, kubernetes, or generic' >> $GITHUB_STEP_SUMMARY
            echo '  # ... rest of your configuration' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            ;;
            
          "validation-only")
            echo "### Configuration Found" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Language**: $CONFIGURED_LANGUAGE" >> $GITHUB_STEP_SUMMARY
            echo "- **Mode**: Preview validation only" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "This repository has proper configuration but is running in preview mode." >> $GITHUB_STEP_SUMMARY
            ;;
        esac
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🚀 Benefits of Full Build System" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Automated multi-version builds" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Code signing for all artifacts" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Automatic semantic versioning" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Changelog-driven releases" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Consistent CI/CD across all repositories" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📖 [Complete Build System Guide](https://github.com/keyfactor/github-meta/blob/main/docs/build-system-guide.md)" >> $GITHUB_STEP_SUMMARY