name: 'Validate Integration Manifest'
description: 'Validates integration-manifest.json against the Keyfactor integration manifest schema using AJV'
inputs:
  manifest-file:
    description: 'Path to the integration manifest file to validate'
    required: false
    default: 'integration-manifest.json'
runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Validate manifest
      run: |
        echo "Validating ${{ inputs.manifest-file }} against integration-manifest-schema.json..."
        npx --package=ajv-cli ajv validate -s "${{ github.action_path }}/../../integration-manifest-schema.json" -d "${{ inputs.manifest-file }}" --errors=text --verbose
      shell: bash