name: 'Release Manager'
description: 'Handles semantic versioning, tagging, changelog processing, and release creation'
author: 'Keyfactor'

inputs:
  github-token:
    description: 'GitHub token for creating releases'
    required: true
    
  branch-name:
    description: 'Branch name to extract version from (for release branches)'
    required: false
    default: ${{ github.ref_name }}
    
  changelog-required:
    description: 'Whether changelog.yml is required'
    required: false
    default: 'true'
    
  artifacts-path:
    description: 'Path to build artifacts to include in release'
    required: false
    default: ''
    
  enable-signing:
    description: 'Whether to sign release artifacts'
    required: false
    default: 'false'
    
  create-tag:
    description: 'Whether to create a git tag'
    required: false
    default: 'true'
    
  create-release:
    description: 'Whether to create a GitHub release'
    required: false
    default: 'true'
    
  prerelease:
    description: 'Whether this is a prerelease'
    required: false
    default: 'false'
    
  working-directory:
    description: 'Working directory'
    required: false
    default: '.'

outputs:
  version:
    description: 'Calculated version number'
    value: ${{ steps.version.outputs.version }}
    
  tag-name:
    description: 'Created tag name'
    value: ${{ steps.version.outputs.tag-name }}
    
  release-url:
    description: 'URL of created release'
    value: ${{ steps.release.outputs.release-url }}
    
  release-notes:
    description: 'Generated release notes'
    value: ${{ steps.changelog.outputs.release-notes }}

runs:
  using: 'composite'
  steps:
    - name: Calculate version
      id: version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BRANCH_NAME: ${{ inputs.branch-name }}
      run: |
        echo "Calculating version from branch name and context..."
        
        VERSION=""
        TAG_NAME=""
        
        echo "Branch name: $BRANCH_NAME"
        
        # Extract version from release branch (release-1.2.3 -> v1.2.3)
        if [[ "$BRANCH_NAME" =~ ^release-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
          VERSION="${BASH_REMATCH[1]}"
          TAG_NAME="v$VERSION"
          echo "✓ Extracted version from release branch: $VERSION"
          
        # For main branch merges, try to get version from most recent changelog entry
        elif [ "$BRANCH_NAME" = "main" ]; then
          if [ -f "changelog.yml" ]; then
            # Extract latest version from changelog (simplified)
            VERSION=$(grep -E '^  v?[0-9]+\.[0-9]+\.[0-9]+:' changelog.yml | head -1 | sed 's/://g' | sed 's/^[ ]*v*//' | xargs)
            if [ "$VERSION" != "" ]; then
              TAG_NAME="v$VERSION"
              echo "✓ Found version from changelog: $VERSION"
            fi
          fi
          
          if [ "$VERSION" = "" ]; then
            # Fallback: generate version from date
            VERSION="0.1.$(date +%Y%m%d)"
            TAG_NAME="v$VERSION"
            echo "⚠️  Generated fallback version: $VERSION"
          fi
          
        else
          echo "❌ Unable to determine version from branch $BRANCH_NAME"
          exit 1
        fi
        
        echo "Final version: $VERSION"
        echo "Tag name: $TAG_NAME"
        
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag-name=$TAG_NAME" >> $GITHUB_OUTPUT
        
    - name: Validate changelog
      id: changelog
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CHANGELOG_VERSION: ${{ steps.version.outputs.version }}
        CHANGELOG_REQUIRED: ${{ inputs.changelog-required }}
      run: |
        echo "Processing changelog for version $CHANGELOG_VERSION..."
        
        RELEASE_NOTES=""
        
        if [ "$CHANGELOG_REQUIRED" = "true" ]; then
          if [ ! -f "changelog.yml" ]; then
            echo "❌ changelog.yml is required but not found"
            exit 1
          fi
          
          echo "✓ Found changelog.yml"
          
          # Extract release notes for this version (simplified YAML parsing)
          if grep -q "v*$CHANGELOG_VERSION:" changelog.yml; then
            echo "✓ Found changelog entry for version $CHANGELOG_VERSION"
            
            # Generate release notes from changelog (simplified)
            RELEASE_NOTES="## Release $VERSION\n\n"
            
            # This is a simplified approach - in reality, we'd use yq or a Go tool
            awk "/v*$VERSION:/{flag=1;next}/^  [a-zA-Z]/{flag=0}flag" changelog.yml | while read line; do
              if [[ "$line" =~ type:.*summary ]]; then
                SUMMARY=$(echo "$line" | sed 's/.*description: *"\(.*\)"/\1/')
                RELEASE_NOTES="$RELEASE_NOTES$SUMMARY\n\n"
              elif [[ "$line" =~ type:.*feature ]]; then
                FEATURE=$(echo "$line" | sed 's/.*description: *"\(.*\)"/\1/')
                RELEASE_NOTES="$RELEASE_NOTES- 🚀 $FEATURE\n"
              elif [[ "$line" =~ type:.*bugfix ]]; then
                BUGFIX=$(echo "$line" | sed 's/.*description: *"\(.*\)"/\1/')
                RELEASE_NOTES="$RELEASE_NOTES- 🐛 $BUGFIX\n"
              elif [[ "$line" =~ type:.*breaking ]]; then
                BREAKING=$(echo "$line" | sed 's/.*description: *"\(.*\)"/\1/')
                RELEASE_NOTES="$RELEASE_NOTES- ⚠️  **BREAKING**: $BREAKING\n"
              fi
            done
            
          else
            echo "⚠️  No changelog entry found for version $VERSION"
            RELEASE_NOTES="## Release $VERSION\n\nNo changelog entry provided."
          fi
        else
          echo "ℹ️  Changelog not required"
          RELEASE_NOTES="## Release $VERSION\n\nAutomatically generated release."
        fi
        
        echo "release-notes<<EOF" >> $GITHUB_OUTPUT
        echo -e "$RELEASE_NOTES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
    - name: Create git tag
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      if: inputs.create-tag == 'true'
      env:
        TAG_NAME: ${{ steps.version.outputs.tag-name }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        echo "Creating git tag $TAG_NAME..."
        
        # Check if tag already exists
        if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
          echo "⚠️  Tag $TAG_NAME already exists"
        else
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git tag -a "$TAG_NAME" -m "Release $VERSION"
          git push origin "$TAG_NAME"
          
          echo "✅ Created and pushed tag $TAG_NAME"
        fi
        
    - name: Sign artifacts
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      if: inputs.enable-signing == 'true' && inputs.artifacts-path != ''
      env:
        ARTIFACTS_PATH: ${{ inputs.artifacts-path }}
      run: |
        echo "Signing release artifacts..."
        echo "TODO: Implement artifact signing"
        echo "Artifacts path: $ARTIFACTS_PATH"
        
    - name: Create GitHub release
      id: release
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      if: inputs.create-release == 'true'
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        TAG_NAME: ${{ steps.version.outputs.tag-name }}
        VERSION: ${{ steps.version.outputs.version }}
        PRERELEASE: ${{ inputs.prerelease }}
        RELEASE_NOTES: ${{ steps.changelog.outputs.release-notes }}
        ARTIFACTS_PATH: ${{ inputs.artifacts-path }}
      run: |
        echo "Creating GitHub release..."
        
        PRERELEASE_FLAG=""
        
        if [ "$PRERELEASE" = "true" ]; then
          PRERELEASE_FLAG="--prerelease"
        fi
        
        # Create release notes file
        echo -e "$RELEASE_NOTES" > release-notes.md
        
        # Create release using gh CLI
        if command -v gh >/dev/null 2>&1; then
          RELEASE_URL=$(gh release create "$TAG_NAME" \
            --title "Release $VERSION" \
            --notes-file release-notes.md \
            $PRERELEASE_FLAG \
            --repo ${{ github.repository }})
          
          echo "✅ Created GitHub release: $RELEASE_URL"
          echo "release-url=$RELEASE_URL" >> $GITHUB_OUTPUT
          
          # Upload artifacts if provided
          if [ -n "$ARTIFACTS_PATH" ] && [ -d "$ARTIFACTS_PATH" ]; then
            echo "Uploading artifacts from $ARTIFACTS_PATH..."
            find "$ARTIFACTS_PATH" -type f \( -name "*.dll" -o -name "*.exe" -o -name "*.nupkg" -o -name "*.zip" \) -exec gh release upload "$TAG_NAME" {} \;
            echo "✅ Uploaded artifacts to release"
          fi
        else
          echo "❌ GitHub CLI not available, cannot create release"
          exit 1
        fi
        
        # Clean up
        rm -f release-notes.md
        
    - name: Generate release summary
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
        TAG_NAME: ${{ steps.version.outputs.tag-name }}
        CREATE_RELEASE: ${{ inputs.create-release }}
        RELEASE_URL: ${{ steps.release.outputs.release-url }}
        ENABLE_SIGNING: ${{ inputs.enable-signing }}
        RELEASE_NOTES: ${{ steps.changelog.outputs.release-notes }}
      run: |
        echo "## Release Creation Results" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
        echo "- **Tag**: \`$TAG_NAME\`" >> $GITHUB_STEP_SUMMARY
        
        if [ "$CREATE_RELEASE" = "true" ]; then
          echo "- **Release**: [$TAG_NAME]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ "$ENABLE_SIGNING" = "true" ]; then
          echo "- **Artifacts**: 🔐 Signed" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Release Notes" >> $GITHUB_STEP_SUMMARY
        echo "$RELEASE_NOTES" >> $GITHUB_STEP_SUMMARY